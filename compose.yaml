services:
  portfolio:
    image: hwangzhun/portfolio_website_2:latest
    pull_policy: always
    environment:
      NODE_ENV: "production"
      API_PORT: "8787"
      DATA_DIR: "/app/data"
      UPLOAD_DIR: "/app/data/uploads"

      # 部署前务必修改为强密码。
      ADMIN_PASSWORD: "CHANGE_ME_TO_A_STRONG_PASSWORD"

      # 可选：后台预览使用的公网地址，例如 https://portfolio.example.com。
      FRONTEND_URL: ""

      # 可选：腾讯云 COS；不使用时保持空白即可。
      TENCENT_COS_SECRET_ID: ""
      TENCENT_COS_SECRET_KEY: ""
      TENCENT_COS_BUCKET: ""
      TENCENT_COS_REGION: "ap-guangzhou"
      TENCENT_COS_CDN_URL: ""
    ports:
      - "8787:8787"
    volumes:
      - portfolio_data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "/app/portfolio", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  portfolio_data:
