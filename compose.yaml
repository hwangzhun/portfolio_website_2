services:
  portfolio:
    build:
      context: .
      target: production
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 8787
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "${HOST_PORT:-8787}:8787"
    volumes:
      - portfolio_data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  portfolio_data:
